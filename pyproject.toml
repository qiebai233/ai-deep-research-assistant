[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "deepresearch"
version = "0.1.0"
description = "AI deep-research assistant: ask one question, get a cited, multi-source research report. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DeepResearch Contributors" }]
keywords = [
    "ai", "agent", "deep-research", "llm", "rag", "research", "report",
    "web-search", "openai", "deepseek", "zero-dependency",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]
dependencies = []

[project.optional-dependencies]
# Everything below is optional: DeepResearch itself runs on the standard library.
dev = ["ruff>=0.5", "coverage[toml]>=7.5", "build>=1.2", "twine>=5.0"]

[project.scripts]
deepresearch = "deepresearch.cli:main"

[project.urls]
Homepage = "https://github.com/qiebai233/ai-deep-research-assistant"
Repository = "https://github.com/qiebai233/ai-deep-research-assistant"
Documentation = "https://github.com/qiebai233/ai-deep-research-assistant#readme"
Issues = "https://github.com/qiebai233/ai-deep-research-assistant/issues"
Changelog = "https://github.com/qiebai233/ai-deep-research-assistant/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepresearch = ["py.typed"]
"deepresearch.server" = ["static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed long HTML / prompt strings on purpose.
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["deepresearch"]

[tool.coverage.run]
source = ["deepresearch"]
omit = ["*/static/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
