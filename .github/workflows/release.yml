# Release：推送形如 v0.1.0 的 tag 时，构建 sdist/wheel 并创建 GitHub Release。
#
# 发布流程：
#   1. 确认 main 上 CI 全绿，CHANGELOG.md 与 pyproject.toml 版本号一致
#   2. git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#   3. Actions 运行本工作流，发布页出现带附件的 Release（自动生成 release notes）
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2"

      # 校验 tag（v0.1.0）与包内 __version__ 一致，防止发错版本
      - name: Verify tag matches package version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/deepresearch/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          assert m, "__version__ not found"
          print(m.group(1))
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version v$VERSION"
            exit 1
          fi
          echo "version: v$VERSION"

      - name: Run tests before releasing
        run: |
          pip install -e ".[dev]"
          python run_tests.py -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "DeepResearch v${{ needs.build.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          body: |
            ## DeepResearch v${{ needs.build.outputs.version }}

            AI 深度调研助手：输入一个研究问题，自动完成检索、阅读、交叉验证与带引用的研究报告。
            零第三方运行时依赖，Python ≥ 3.10。

            ### 安装

            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/deepresearch-${{ needs.build.outputs.version }}-py3-none-any.whl
            ```

            ### 离线试用（无需 API key）

            ```bash
            deepresearch run "固态电池 2025 产业化进展" --provider mock
            ```

            完整说明见 [README](https://github.com/${{ github.repository }}#readme)，
            变更见 [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # PyPI 发布（可选，默认关闭）
  #
  # 启用方式（Trusted Publishing，无需在仓库里存 token）：
  #   1. 在 https://pypi.org/manage/account/publishing/ 添加 pending publisher：
  #        PyPI Project Name: deepresearch
  #        Owner:            <你的 GitHub 用户名>
  #        Repository name:  deepresearch
  #        Workflow name:    release.yml
  #        Environment name: pypi
  #   2. 在 GitHub 仓库 Settings → Environments 创建名为 `pypi` 的 environment
  #      （建议加 required reviewers，发布前人工确认）
  #   3. 取消下面 publish-pypi job 的注释，并把顶层 permissions 改为
  #        contents: write
  #        id-token: write
  #   4. 之后每次打 tag 都会自动上传到 PyPI（重复上传同一版本会失败，属正常）。
  #
  # 使用 API token 的替代方案：在仓库 Secrets 添加 PYPI_API_TOKEN，
  # 并把 `with: password:` 换成 `${{ secrets.PYPI_API_TOKEN }}` 且去掉 id-token 权限。
  #
  # publish-pypi:
  #   name: Publish to PyPI
  #   runs-on: ubuntu-latest
  #   needs: [build, release]
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/deepresearch
  #   permissions:
  #     id-token: write
  #   steps:
  #     - name: Download artifacts
  #       uses: actions/download-artifact@v8
  #       with:
  #         name: dist
  #         path: dist
  #
  #     - name: Publish to PyPI (trusted publishing)
  #       uses: pypa/gh-action-pypi-publish@release/v1
  #       with:
  #         packages-dir: dist/
