name: 功能建议
description: 提出新功能、改进点或新 provider 支持
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先说明**使用场景**，这比方案本身更有帮助。

        注意本项目的硬性边界：**零第三方运行时依赖**（仅 Python 标准库）、测试不联网。
        依赖第三方库的方案需要充分理由，且很可能被改为标准库实现。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
      description: 你现在遇到什么困难？谁会受益？
      placeholder: 例如：需要把报告直接发布到公司 wiki，目前只能手动复制 Markdown。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望怎么用？可以是 CLI 参数、环境变量、API 或 UI 交互。
      placeholder: |
        deepresearch run "..." --format html
        或：提供 `deepresearch export <run_id> --format pdf`
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有的绕过方式、其他工具的做法等。
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - CLI / 参数
        - Web UI
        - LLM provider（新增模型/服务商）
        - 搜索 provider
        - 抓取 / 正文提取
        - 报告结构 / 渲染 / 导出
        - 配置 / 部署（Docker、CI）
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 我理解本项目要求零运行时依赖（只用 Python 标准库）
          required: true
        - label: 我理解测试必须离线（禁止真实联网）
          required: true
        - label: 我愿意提交 PR 实现这个功能
          required: false
