# CI：push / PR 时运行 lint、3.10–3.13 测试矩阵、构建产物。
# 所有测试都是离线的（mock provider + 本地 stdlib HTTP 服务），不需要任何 API key。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查：ruff + 字节码编译（快速失败，先跑）
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Byte-compile
        run: python -m compileall -q src

  # ---------------------------------------------------------------------------
  # 测试矩阵：Python 3.10 / 3.11 / 3.12 / 3.13，全部离线
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: python run_tests.py -v

      - name: Verify installed CLI works (offline mock)
        run: |
          deepresearch version
          deepresearch run "CI smoke test" --provider mock --depth quick --out reports-ci --quiet
          test -f "$(ls -d reports-ci/*/ | head -n1)report.md"

  # ---------------------------------------------------------------------------
  # 构建：sdist + wheel，产物上传为 artifact
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1.2"

      - name: Build sdist and wheel
        run: python -m build

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 跨平台冒烟（Windows）：确认 CLI 在 Windows 上可安装、可离线运行
  # ---------------------------------------------------------------------------
  smoke-windows:
    name: Smoke test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Offline CLI run
        shell: pwsh
        run: |
          deepresearch version
          deepresearch run "Windows smoke test" --provider mock --depth quick --out reports-ci --quiet
          $report = Get-ChildItem -Path reports-ci -Recurse -Filter report.md | Select-Object -First 1
          if (-not $report) { throw "report.md was not generated" }
          Write-Host "OK: $($report.FullName)"
