name: Bug 报告
description: 报告可复现的问题（崩溃、报错、输出错误、UI 异常）
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供**可复现**的信息。

        提交前请确认：
        - 已搜索现有 issue，避免重复；
        - 已隐藏所有 API key / token / 个人隐私；
        - 如果是安全问题，请**不要**在这里公开，按 [SECURITY.md](https://github.com/qiebai233/ai-deep-research-assistant/blob/main/SECURITY.md) 私下报告。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望是什么？
      placeholder: 例如：运行 deepresearch run 时抛出 KeyError，报告未生成。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写清从干净环境开始的最小步骤（可直接粘贴命令）。
      placeholder: |
        1. pip install -e .
        2. deepresearch run "测试问题" --provider mock
        3. 观察输出 ...
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: 完整命令
      description: 你执行的命令（含所有参数）
      placeholder: deepresearch run "..." --provider mock --depth standard
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: 受影响模块
      options:
        - CLI（deepresearch run/serve/providers/init/version）
        - Web UI（deepresearch serve）
        - LLM provider
        - 搜索 provider
        - 网页抓取 / 正文提取
        - 报告生成 / Markdown 渲染
        - 文档 / 示例
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: "`deepresearch version` 的输出，或 git commit hash"
      placeholder: deepresearch 0.1.0
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python 版本
      options:
        - "3.13"
        - "3.12"
        - "3.11"
        - "3.10"
        - "其他（请在描述里注明）"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - Docker / 容器
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - pip install -e .
        - pip install deepresearch（或 wheel）
        - 源码直接运行（python run_tests.py）
        - Docker
        - 其他
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider 组合
      options:
        - mock / mock（离线演示）
        - DeepSeek + Tavily
        - OpenAI + Tavily
        - OpenRouter + Tavily
        - Ollama / 自定义 + SearXNG
        - 无搜索（none）
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误日志 / traceback
      description: 粘贴关键日志；可用 `--quiet` 外的方式获取完整输出，或附上 trace.jsonl 的相关片段。**请先脱敏。**
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: 相关配置（脱敏后）
      description: 相关的环境变量或 .env 片段。**绝不要粘贴 API key**，用 `<redacted>` 代替。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issue，没有发现重复
          required: true
        - label: 我已移除所有 API key 与敏感信息
          required: true
        - label: 我可以用 `--provider mock` 离线复现（若适用）
          required: false
