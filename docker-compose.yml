# -----------------------------------------------------------------------------
# DeepResearch —— 本地 / 单机部署示例
#
#   1) cp .env.example .env        # 可选；无 .env 时以 mock 模式离线运行
#   2) docker compose up --build
#   3) 打开 http://127.0.0.1:8000
#
# 需要 Docker Compose v2.24+（`env_file.required` 语法）。
# 若使用旧版本，把 env_file 整段删除，改用 `environment:` 直接写变量即可。
# -----------------------------------------------------------------------------
services:
  deepresearch:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepresearch:0.1.0
    container_name: deepresearch

    # 可选：.env 不存在时也能启动（默认 mock 离线模式）
    env_file:
      - path: .env
        required: false

    environment:
      # 容器内报告/缓存目录（与 Dockerfile 中的可写目录一致）
      DEEPRESEARCH_OUT_DIR: /data/reports
      DEEPRESEARCH_CACHE_DIR: /data/cache

    # 默认 Web UI；只绑定本机回环地址，避免无鉴权服务暴露到局域网
    ports:
      - "127.0.0.1:8000:8000"

    # 持久化报告与抓取缓存
    volumes:
      - ./reports:/data/reports
      - deepresearch-cache:/data/cache

    restart: unless-stopped

    # 非 root 用户（与镜像内 uid/gid 对齐；宿主挂载目录需可写）
    user: "10001:10001"

volumes:
  deepresearch-cache:
